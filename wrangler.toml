name = "eduvault"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "eduvault-db"
database_id = "aee23ea2-0df7-4133-9d0f-c5fdc492f134"

[[previews.d1_databases]]
binding = "DB"
database_id = "aee23ea2-0df7-4133-9d0f-c5fdc492f134"
